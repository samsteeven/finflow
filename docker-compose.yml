# Pile locale de FinFlow (ADR-006).
#   docker compose up -d                    PostgreSQL + Keycloak (~1,3 Go)
#   docker compose --profile kafka up -d    + Kafka KRaft un nœud (~0,8 Go)
# Les services se lancent depuis backend/ avec ./mvnw spring-boot:run (voir README).
name: finflow

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: finflow
      POSTGRES_PASSWORD: finflow_dev
      POSTGRES_DB: postgres
    ports:
      - "5439:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infrastructure/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finflow -d finflow_ledger"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm", "--http-port=8180", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin_dev
      JAVA_OPTS_KC_HEAP: "-Xms128m -Xmx512m"
    ports:
      - "8180:8180"
    volumes:
      - ./infrastructure/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # L'image n'a ni curl ni wget : requête HTTP à la main sur le port de gestion.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 3s
      retries: 40
    mem_limit: 900m

  kafka:
    image: apache/kafka:4.3.2
    profiles: ["kafka"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      # Les topics sont déclarés explicitement, jamais créés par une faute de frappe.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx384m"
    ports:
      - "9094:9094"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
    mem_limit: 768m

volumes:
  postgres-data:
  kafka-data:
