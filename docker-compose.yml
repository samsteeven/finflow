# Pile locale de FinFlow (ADR-006).
#   docker compose up -d                    PostgreSQL + Keycloak (~1,3 Go)
#   docker compose --profile kafka up -d    + Kafka KRaft un nœud et Schema Registry (~1,3 Go)
#   docker compose --profile observability up -d   + Prometheus, Grafana, Jaeger (~0,6 Go)
#   docker compose --profile chaos up -d    + Toxiproxy (pannes réseau simulées, scripts/chaos.sh)
# Les services se lancent depuis backend/ avec ./mvnw spring-boot:run (voir README).
name: finflow

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: finflow
      POSTGRES_PASSWORD: finflow_dev
      POSTGRES_DB: postgres
    ports:
      - "5439:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infrastructure/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finflow -d finflow_ledger"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm", "--http-port=8180", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin_dev
      # L'émetteur des jetons ne dépend pas de l'adresse utilisée pour joindre Keycloak : Prometheus
      # (dans Docker) et les services (sur l'hôte) obtiennent des jetons du même émetteur (ADR-017).
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      JAVA_OPTS_KC_HEAP: "-Xms128m -Xmx512m"
    ports:
      - "8180:8180"
    volumes:
      - ./infrastructure/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # L'image n'a ni curl ni wget : requête HTTP à la main sur le port de gestion.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 3s
      retries: 40
    mem_limit: 900m

  kafka:
    image: apache/kafka:4.3.2
    profiles: ["kafka"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      # Les topics sont déclarés explicitement, jamais créés par une faute de frappe.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx384m"
    ports:
      - "9094:9094"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
    mem_limit: 768m

  schema-registry:
    image: confluentinc/cp-schema-registry:8.1.0
    profiles: ["kafka"]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8085
      KAFKA_HEAP_OPTS: "-Xms64m -Xmx256m"
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8085/subjects > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
    mem_limit: 512m

  prometheus:
    image: prom/prometheus:v3.16.0
    profiles: ["observability"]
    depends_on:
      keycloak:
        condition: service_healthy
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
      # Reçoit aussi les mesures de k6 (load/README.md).
      - --web.enable-remote-write-receiver
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./infrastructure/observability/prometheus:/etc/prometheus:ro
    ports:
      - "9090:9090"
    mem_limit: 384m

  grafana:
    image: grafana/grafana:13.3.1
    profiles: ["observability"]
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin_dev
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/finflow.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./infrastructure/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    mem_limit: 384m

  jaeger:
    image: jaegertracing/jaeger:2.23.0
    profiles: ["observability"]
    ports:
      - "16686:16686"   # interface
      - "4318:4318"     # OTLP HTTP : les services y envoient leurs traces
    mem_limit: 384m

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.13.0
    profiles: ["chaos"]
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./infrastructure/chaos:/config:ro
    ports:
      - "8474:8474"     # API de contrôle
      - "28084:28084"   # proxy vers le Ledger
      - "28082:28082"   # proxy vers Account
    mem_limit: 64m

volumes:
  postgres-data:
  kafka-data:
