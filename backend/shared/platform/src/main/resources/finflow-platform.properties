# Valeurs par défaut communes (priorité la plus basse : l'application.yml de chaque service les remplace).

# Métriques : santé et Prometheus. /actuator/prometheus n'est jamais routé par la Gateway.
management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.http.client.requests=true

# Traces OpenTelemetry : tout est échantillonné en développement ; l'export OTLP vers le collecteur
# (Jaeger dans le profil observability) n'est actif que si TRACING_EXPORT_ENABLED=true.
management.tracing.sampling.probability=${TRACING_SAMPLING:1.0}
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
management.opentelemetry.tracing.export.otlp.timeout=2s
management.opentelemetry.tracing.export.otlp.compression=gzip
management.tracing.export.otlp.enabled=${TRACING_EXPORT_ENABLED:false}
management.logging.export.otlp.enabled=false
management.otlp.metrics.export.enabled=false

# Les journaux portent l'identifiant de trace : un paiement se suit d'un service à l'autre.
logging.pattern.correlation=[${spring.application.name:},%X{traceId:-},%X{spanId:-}]
logging.include-application-name=false
management.observations.enable.spring.security=false
