spring:
  application:
    name: payment-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${PAYMENT_DB_URL:jdbc:postgresql://localhost:5439/finflow_payment}
    # Rôle applicatif : ni propriétaire, ni BYPASSRLS (ADR-005).
    username: ${PAYMENT_DB_APP_USER:finflow_payment_app}
    password: ${PAYMENT_DB_APP_PASSWORD:finflow_payment_app_dev}
    hikari:
      maximum-pool-size: 10
  flyway:
    # Les migrations s'exécutent avec le rôle propriétaire.
    user: ${PAYMENT_DB_OWNER_USER:finflow_payment_owner}
    password: ${PAYMENT_DB_OWNER_PASSWORD:finflow_payment_owner_dev}
    placeholders:
      app_role: ${spring.datasource.username}
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/finflow}
          jwk-set-uri: ${KEYCLOAK_JWKS:${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs}
          audiences: finflow-api

finflow:
  accounts:
    base-url: ${ACCOUNT_SERVICE_URL:http://localhost:8082}
    connect-timeout: 1s
    read-timeout: 2s
  ledger:
    base-url: ${LEDGER_SERVICE_URL:http://localhost:8084}
    connect-timeout: 1s
    read-timeout: 3s

  # Compte technique de Payment pour reprendre une saga hors d'une requête (ADR-015).
  service-account:
    token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8180/realms/finflow/protocol/openid-connect/token}
    client-id: payment-service
    client-secret: ${PAYMENT_CLIENT_SECRET:payment-service-dev-secret}
  saga:
    recovery:
      enabled: ${SAGA_RECOVERY_ENABLED:false}
      interval: 2s
      base-delay: 5s
      batch-size: 20
  messaging:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9094}
    schema-registry-url: ${SCHEMA_REGISTRY_URL:http://localhost:8085}
    relay:
      enabled: ${MESSAGING_ENABLED:false}

server:
  port: ${PORT:8083}

management:
  endpoint:
    health:
      probes:
        enabled: true
