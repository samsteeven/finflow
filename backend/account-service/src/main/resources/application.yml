spring:
  application:
    name: account-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${ACCOUNT_DB_URL:jdbc:postgresql://localhost:5439/finflow_account}
    # Rôle applicatif : ni propriétaire, ni BYPASSRLS (ADR-005).
    username: ${ACCOUNT_DB_APP_USER:finflow_account_app}
    password: ${ACCOUNT_DB_APP_PASSWORD:finflow_account_app_dev}
    hikari:
      maximum-pool-size: 10
  flyway:
    # Les migrations s'exécutent avec le rôle propriétaire.
    user: ${ACCOUNT_DB_OWNER_USER:finflow_account_owner}
    password: ${ACCOUNT_DB_OWNER_PASSWORD:finflow_account_owner_dev}
    placeholders:
      app_role: ${spring.datasource.username}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/finflow}
          jwk-set-uri: ${KEYCLOAK_JWKS:${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs}
          audiences: finflow-api

server:
  port: ${PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
