spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/finflow}
          jwk-set-uri: ${KEYCLOAK_JWKS:${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs}
          audiences: finflow-api
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            # Le tenant vient du jeton, jamais d'un en-tête (ADR-004) : on retire toute
            # tentative avant qu'elle n'atteigne un service.
            - RemoveRequestHeader=X-Tenant-Id
            - RemoveRequestHeader=X-User-Id
            - RemoveRequestHeader=Cookie
          routes:
            - id: tenant-service
              uri: ${TENANT_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/tenants,/api/v1/tenants/**

finflow:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
