spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/finflow}
          jwk-set-uri: ${KEYCLOAK_JWKS:${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs}
          audiences: finflow-api
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            # Le tenant vient du jeton, jamais d'un en-tête (ADR-004) : on retire toute
            # tentative avant qu'elle n'atteigne un service.
            - RemoveRequestHeader=X-Tenant-Id
            - RemoveRequestHeader=X-User-Id
            - RemoveRequestHeader=Cookie
          routes:
            - id: tenant-service
              uri: ${TENANT_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/tenants,/api/v1/tenants/**
            - id: account-service
              uri: ${ACCOUNT_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/accounts,/api/v1/accounts/**
            - id: payment-service
              uri: ${PAYMENT_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/payments,/api/v1/payments/**
            # Seule la partie publique du Ledger est exposée : /internal/** (écritures réservées à
            # Payment, ADR-012) n'a volontairement aucune route.
            - id: ledger-service
              uri: ${LEDGER_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/ledger,/api/v1/ledger/**

finflow:
  gateway:
    rate-limit:
      # Quota par organisation (clé : tenant_id du jeton) ; au-delà, 429 avec Retry-After.
      enabled: ${RATE_LIMIT_ENABLED:true}
      requests-per-period: ${RATE_LIMIT_REQUESTS:300}
      period: ${RATE_LIMIT_PERIOD:1m}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        # Posé ici aussi : la Gateway ne reprend pas les valeurs par défaut du module platform.
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
