spring:
  application:
    name: ledger-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${LEDGER_DB_URL:jdbc:postgresql://localhost:5439/finflow_ledger}
    # Rôle applicatif : ni propriétaire, ni BYPASSRLS (ADR-005).
    username: ${LEDGER_DB_APP_USER:finflow_ledger_app}
    password: ${LEDGER_DB_APP_PASSWORD:finflow_ledger_app_dev}
    hikari:
      maximum-pool-size: 10
  flyway:
    # Les migrations s'exécutent avec le rôle propriétaire.
    user: ${LEDGER_DB_OWNER_USER:finflow_ledger_owner}
    password: ${LEDGER_DB_OWNER_PASSWORD:finflow_ledger_owner_dev}
    placeholders:
      app_role: ${spring.datasource.username}
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/finflow}
          jwk-set-uri: ${KEYCLOAK_JWKS:${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs}
          audiences: finflow-api

finflow:
  accounts:
    base-url: ${ACCOUNT_SERVICE_URL:http://localhost:8082}
    connect-timeout: 1s
    read-timeout: 2s

  messaging:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9094}
    schema-registry-url: ${SCHEMA_REGISTRY_URL:http://localhost:8085}
    relay:
      enabled: ${MESSAGING_ENABLED:false}

server:
  port: ${PORT:8084}

management:
  endpoint:
    health:
      probes:
        enabled: true
