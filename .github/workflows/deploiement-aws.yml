name: Déploiement AWS

# Déploiement MANUEL de l'environnement de démonstration (ADR-018), approuvé dans l'environnement GitHub « aws-demo »
# (approbation obligatoire). Jamais déclenché par un push : il crée des ressources facturées (≈ 0,40 $ par heure).
# Ordre : jars → images (une fois, étiquettes immuables, analysées) → Terraform (bases initialisées avant les services,
# déploiement progressif avec retour automatique) → front → vérification par l'adresse publique.
# Les migrations de schéma sont rétrocompatibles (ajouter avant de retirer) : l'ancienne version tourne sur le nouveau
# schéma, ce qui rend le retour arrière possible (redéployer une étiquette précédente).
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-demo
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-3' }}
  TAG: ${{ github.sha }}

jobs:
  images:
    runs-on: ubuntu-24.04
    environment: aws-demo
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - name: Jars (les tests tournent dans le workflow CI, pas ici)
        working-directory: backend
        run: ./mvnw -B -ntp -DskipTests package
      - name: Realm Keycloak de l'environnement AWS
        run: python3 infrastructure/keycloak/generer-realm.py --cloud
      - name: Images de cette version (construites une seule fois, étiquettes immuables)
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          pousser() { # $1 nom du dépôt (sans finflow-), $2 contexte, $3... options de build
            repo="finflow-$1"; contexte="$2"; shift 2
            if aws ecr describe-images --repository-name "$repo" --image-ids imageTag="$TAG" > /dev/null 2>&1; then
              echo "$repo:$TAG existe déjà"
            else
              docker build --platform linux/amd64 "$@" --tag "$REGISTRY/$repo:$TAG" "$contexte"
              docker push -q "$REGISTRY/$repo:$TAG"
            fi
          }
          for service in api-gateway tenant-service account-service ledger-service payment-service; do
            pousser "$service" backend --build-arg "SERVICE=$service"
          done
          pousser keycloak infrastructure/aws/keycloak --file infrastructure/aws/keycloak/Dockerfile
          pousser init-bases infrastructure/aws/init-bases
          ECR_REGISTRY="$REGISTRY" scripts/aws-miroir-images.sh
      - name: Analyse des images (vulnérabilités critiques corrigeables bloquantes)
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY" > /dev/null
          for service in api-gateway tenant-service account-service ledger-service payment-service keycloak init-bases; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$HOME/.docker/config.json:/root/.docker/config.json:ro" \
              aquasec/trivy:0.76.1 image --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress \
              "$REGISTRY/finflow-$service:$TAG"
          done

  deploiement:
    needs: images
    runs-on: ubuntu-24.04
    environment: aws-demo
    timeout-minutes: 60
    defaults:
      run:
        working-directory: infrastructure/aws/terraform
    env:
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
      TF_VAR_image_tag: ${{ github.sha }}
      TF_IN_AUTOMATION: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 3600
      - name: Terraform init
        run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="region=$AWS_REGION"
      - name: Plan (visible dans le journal avant l'application)
        run: terraform plan -input=false -out=plan.tfplan
      - name: Infrastructure, bases, puis services (retour automatique si une version n'est pas saine)
        run: terraform apply -input=false plan.tfplan
      - name: Front
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx ng build --configuration aws
          bucket=$(terraform -chdir=../infrastructure/aws/terraform output -raw web_bucket)
          # Fichiers à empreinte : en cache un an ; index.html : jamais en cache (il désigne la version courante).
          aws s3 sync dist/frontend/browser "s3://$bucket" --delete --exclude index.html \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp dist/frontend/browser/index.html "s3://$bucket/index.html" --cache-control "no-cache"
          aws cloudfront create-invalidation --distribution-id \
            "$(terraform -chdir=../infrastructure/aws/terraform output -raw cloudfront_distribution_id)" --paths /index.html > /dev/null
      - name: Vérification sur l'adresse publique
        working-directory: .
        run: |
          url=$(terraform -chdir=infrastructure/aws/terraform output -raw url)
          scripts/verifier-deploiement.sh "$url"
          {
            echo "### FinFlow déployé : $url (version \`${TAG::7}\`)"
            echo "Comptes de démonstration : alice, bruno, clara, plateforme ; mot de passe dans Secrets Manager (\`finflow-demo/demo-users-password\`)."
            echo "**Détruire après usage** : workflow « Destruction AWS »."
          } >> "$GITHUB_STEP_SUMMARY"
