name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tests unitaires et d'intégration)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Construire et tester (Testcontainers)
        run: ./mvnw -B -ntp verify
      - name: Rapports de tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rapports-de-tests
          path: backend/**/target/*-reports/
          retention-days: 7

  frontend:
    name: Front (compilation et tests unitaires)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Compiler
        run: npx ng build
      - name: Tests unitaires
        run: npx ng test --watch=false

  infrastructure:
    name: Infrastructure AWS (validation, sans rien créer)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - name: Terraform : format et validité
        working-directory: infrastructure/aws/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
      - name: Le realm Keycloak AWS est à jour
        run: |
          python3 infrastructure/keycloak/generer-realm.py --cloud
          python3 infrastructure/keycloak/generer-realm.py
          git diff --exit-code -- infrastructure/aws/keycloak/finflow-realm-cloud.json infrastructure/keycloak/finflow-realm.json
      - name: Analyse de la configuration (défauts moyens et plus bloquants)
        run: |
          docker run --rm -v "$PWD/infrastructure/aws:/work:ro" aquasec/trivy:0.76.1 config             --severity MEDIUM,HIGH,CRITICAL --exit-code 1 --no-progress /work

  pile:
    name: Pile locale et parcours Playwright (Keycloak, Kafka, services, front)
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Construire les jars
        working-directory: backend
        run: ./mvnw -B -ntp package -DskipTests
      - name: Démarrer PostgreSQL, Keycloak, Kafka et Schema Registry
        run: docker compose --profile kafka up -d --wait
      - name: Démarrer les services et la Gateway
        env:
          # Outbox, consommateurs et reprise automatique des sagas (incrément 4).
          MESSAGING_ENABLED: "true"
          SAGA_RECOVERY_ENABLED: "true"
        run: |
          mkdir -p logs
          SPRING_PROFILES_ACTIVE=demo nohup java -Xmx256m -jar backend/tenant-service/target/tenant-service-*.jar > logs/tenant.log 2>&1 &
          nohup java -Xmx256m -jar backend/account-service/target/account-service-*.jar > logs/account.log 2>&1 &
          nohup java -Xmx256m -jar backend/payment-service/target/payment-service-*.jar > logs/payment.log 2>&1 &
          nohup java -Xmx256m -jar backend/ledger-service/target/ledger-service-*.jar > logs/ledger.log 2>&1 &
          nohup java -Xmx192m -jar backend/api-gateway/target/api-gateway-*.jar > logs/gateway.log 2>&1 &
          for port in 8081 8082 8083 8084 8080; do
            timeout 90 bash -c "until curl -sf http://localhost:$port/actuator/health > /dev/null; do sleep 2; done"
          done
      - name: Vérifier la pile avec de vrais jetons Keycloak
        run: bash scripts/verifier-pile.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installer le front et Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Parcours Playwright contre la vraie pile
        working-directory: frontend
        run: npx playwright test
      - name: Rapport Playwright
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rapport-playwright
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
      - name: Journaux
        if: failure()
        run: |
          cat logs/*.log || true
          docker compose logs --no-color --tail=200
