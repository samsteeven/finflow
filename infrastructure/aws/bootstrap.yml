Outputs:
  DeployRoleArn:
    Description: À copier dans la variable GitHub AWS_ROLE_ARN.
    Value: !GetAtt DeployRole.Arn
  TerraformStateBucket:
    Description: À copier dans la variable GitHub TF_STATE_BUCKET.
    Value: !Ref TerraformStateBucket
  RegistryHost:
    Description: Hôte ECR (images finflow-<nom>) ; à copier dans la variable GitHub ECR_REGISTRY.
    Value: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com
