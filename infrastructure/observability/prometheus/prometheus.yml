# Collecte des métriques des cinq services (docker compose --profile observability up).
# Les services tournent sur l'hôte ; Prometheus les joint par host.docker.internal.
# /actuator/prometheus exige le rôle `metrics` : Prometheus présente le jeton du client Keycloak
# `prometheus` (client credentials), renouvelé tout seul (ADR-017).
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: finflow
    metrics_path: /actuator/prometheus
    oauth2:
      client_id: prometheus
      client_secret: prometheus-dev-secret
      token_url: http://keycloak:8180/realms/finflow/protocol/openid-connect/token
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels: { service: api-gateway }
      - targets: ["host.docker.internal:8081"]
        labels: { service: tenant-service }
      - targets: ["host.docker.internal:8082"]
        labels: { service: account-service }
      - targets: ["host.docker.internal:8083"]
        labels: { service: payment-service }
      - targets: ["host.docker.internal:8084"]
        labels: { service: ledger-service }
